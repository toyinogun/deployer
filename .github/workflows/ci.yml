name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: go test
        run: go test -race ./...

      # The build pod must start as the user the pinned builder declares: the
      # lifecycle switches to CNB_USER_ID before it does any work, and under
      # `restricted` it holds no capability to switch with. Nothing reads that
      # off the image at run time, because that would put a Docker Hub call on
      # the control plane's startup path, so the uid lives in the configmap
      # beside the digest it belongs to and this step is what keeps the two
      # honest. Without it, repinning the builder alone passes every unit test
      # (the fake clientset execs nothing) and kills every real build with
      # "failed to exec as user ...: operation not permitted".
      - name: builder uid
        run: |
          set -euo pipefail
          value() { grep -E "^  $1:" deploy/configmap.yaml | sed -E 's/^[^:]+: *"?([^"]*)"?$/\1/'; }
          image=$(value DEPLOYER_BUILDER_IMAGE)
          repo=${image%@*}
          digest=${image#*@}
          echo "reading $repo@$digest"

          token=$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" | jq -r .token)
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          fetch() { curl -fsSL -H "Authorization: Bearer $token" -H "Accept: $accept" "https://registry-1.docker.io/v2/${repo}/manifests/$1"; }

          manifest=$(fetch "$digest")
          # A multi platform index names no config of its own, so follow it to the
          # linux/amd64 manifest, which is what the cluster runs.
          if [ "$(jq -r 'has("manifests")' <<<"$manifest")" = true ]; then
            child=$(jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest' <<<"$manifest" | head -1)
            [ -n "$child" ] || { echo "no linux/amd64 manifest in the index" >&2; exit 1; }
            manifest=$(fetch "$child")
          fi

          config=$(jq -r .config.digest <<<"$manifest")
          env_json=$(curl -fsSL -H "Authorization: Bearer $token" "https://registry-1.docker.io/v2/${repo}/blobs/${config}" | jq -c '.config.Env')
          from_image() { jq -r --arg k "$1" '.[] | select(startswith($k + "=")) | sub("^[^=]+="; "")' <<<"$env_json"; }

          status=0
          for pair in "CNB_USER_ID DEPLOYER_BUILD_UID" "CNB_GROUP_ID DEPLOYER_BUILD_GID"; do
            set -- $pair
            want=$(value "$2")
            got=$(from_image "$1")
            [ -n "$got" ] || { echo "the builder image declares no $1" >&2; status=1; continue; }
            if [ "$want" != "$got" ]; then
              echo "$2 is $want but the pinned builder declares $1=$got" >&2
              status=1
            else
              echo "$2=$want matches the image's $1"
            fi
          done
          exit $status

      # ko builds the image straight from the module, no Dockerfile. On a pull
      # request this only proves it builds; the publish job below pushes.
      - uses: ko-build/setup-ko@v0.9

      - name: ko build
        run: ko build --push=false --platform=linux/amd64 ./cmd/deployer

  # Publishes the image and writes its digest into deploy/deployment.yaml, which
  # is the file ArgoCD applies verbatim. Without this the manifest carries a
  # placeholder digest no kubelet can pull.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the pinned digest back to main
      packages: write # to push to ghcr.io
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ko-build/setup-ko@v0.9

      - name: Publish and pin the digest
        env:
          # --bare puts the image at exactly this repo rather than appending the
          # import path, so the reference stays short and stable.
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | ko login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=$(ko build --bare --platform=linux/amd64 ./cmd/deployer)
          echo "published $image"
          case "$image" in
            *@sha256:*) ;;
            *) echo "ko returned no digest: $image" >&2; exit 1 ;;
          esac
          # Anchored on the leading spaces and the key so nothing else in the file
          # can match. The | delimiter keeps the digest's own characters safe.
          sed -i -E "s|^( +)image: ghcr\.io/.*$|\1image: ${image}|" deploy/deployment.yaml
          grep -q "image: ${image}$" deploy/deployment.yaml
          # DEPLOYER_SELF_IMAGE is the same image, read back by the control plane
          # so it can use itself as the build Job's init container. The downward
          # API cannot supply it, so it is rewritten here from the same value and
          # the two can never drift (spec 0004).
          sed -i -E "s|^( +)value: ghcr\.io/.*$|\1value: ${image}|" deploy/deployment.yaml
          grep -q "value: ${image}$" deploy/deployment.yaml

      - name: Commit the pinned digest
        run: |
          set -euo pipefail
          if git diff --quiet -- deploy/deployment.yaml; then
            echo "digest unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deployment.yaml
          # [skip ci] so this commit does not start another run. The digest would
          # be identical on a second pass, so the loop would end anyway, but not
          # spending a full CI run to discover that is cheaper.
          git commit -m "chore(deploy): pin the control plane image digest [skip ci]"
          git push
