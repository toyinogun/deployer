name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: go test
        run: go test -race ./...

      # ko builds the image straight from the module, no Dockerfile. This only
      # proves it builds; pushing is a separate job once the registry exists.
      - uses: ko-build/setup-ko@v0.9

      - name: ko build
        run: ko build --push=false --platform=linux/amd64 ./cmd/deployer
