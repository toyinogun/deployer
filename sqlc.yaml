version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/store/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/store/sqlcgen"
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - column: "*.size_bytes"
            go_type: "int64"
