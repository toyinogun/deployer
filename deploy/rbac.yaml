apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: deployer-system
---
# The whole set of rights the control plane holds. Anything absent is denied.
# One row per Kubernetes kind the platform actually composes (spec 0003, AC-3).
# Deliberately absent: nodes, persistentvolumes, roles, rolebindings,
# clusterroles, clusterrolebindings, customresourcedefinitions, apiservices, and
# every escalate, bind, impersonate, or wildcard verb. The control plane cannot
# widen its own access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployer
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [services, secrets, serviceaccounts, configmaps, resourcequotas]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  # Slice 3 reads app logs through this. Granted now so RBAC is not reopened mid slice.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Slice 1 creates build Jobs through this.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # KNOWN GAP, flagged rather than fixed here: spec 0003 requires a LimitRange in
  # every app namespace, but its ClusterRole table does not grant `limitranges`,
  # and AC-3 says this must be exactly one ClusterRole holding exactly that set.
  # The set above is the spec verbatim. Nothing in this feature creates a
  # LimitRange from code, so nothing is broken yet; slice 1 is where it bites.
  # Fix the spec first: /architect cluster foundation: the ClusterRole omits
  # limitranges, which the LimitRange requirement needs.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: deployer-system
