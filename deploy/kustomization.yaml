apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` transformer here, on purpose. It rewrites every Namespace
# object's name, so listing two of them (deployer-system and deployer-builds)
# makes the build fail with an ID conflict, and it silently moved the
# deployer-builds RoleBinding into deployer-system. Every namespaced object in
# this directory carries its own `metadata.namespace`, which is what a reader
# checking where something lands should be able to see in the file itself.
resources:
  - namespace.yaml
  # The fence around the control plane namespace itself: ingress only, so the
  # platform's own outbound path to the API server is untouched (spec 0019).
  - deployer-system-networkpolicy.yaml
  - builds-namespace.yaml
  - builds-networkpolicy.yaml
  # The Dockerfile path's own namespace, at `privileged`, holding rootless
  # BuildKit Jobs and nothing else, with the same fence copied into it. Separate
  # files rather than a second document in the pair above, for the same reason
  # the comment at the top of this file gives: a Namespace object is not
  # something to bury beside another one.
  - builds-dockerfile-namespace.yaml
  - builds-dockerfile-networkpolicy.yaml
  - rbac.yaml
  - admission-policy.yaml
  # Sealed to this cluster's key, so they are safe to commit and useless
  # anywhere else. The two registry halves are one password in two shapes and
  # are regenerated together; see README.md step 1.
  - registry-htpasswd-sealedsecret.yaml
  - registry-credential-sealedsecret.yaml
  - bootstrap-sealedsecret.yaml
  # The Resend API key. Optional to the pod, which boots and deploys without it
  # and only refuses register, resend and password reset (spec 0007, AC-26).
  - mail-sealedsecret.yaml
  - web-sealedsecret.yaml
  - registry.yaml
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
