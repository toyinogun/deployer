apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` transformer here, on purpose. It rewrites every Namespace
# object's name, so listing two of them (deployer-system and deployer-builds)
# makes the build fail with an ID conflict, and it silently moved the
# deployer-builds RoleBinding into deployer-system. Every namespaced object in
# this directory carries its own `metadata.namespace`, which is what a reader
# checking where something lands should be able to see in the file itself.
resources:
  - namespace.yaml
  - builds-namespace.yaml
  - rbac.yaml
  - admission-policy.yaml
  - registry.yaml
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
