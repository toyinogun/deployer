apiVersion: v1
kind: ConfigMap
metadata:
  name: deployer-config
  namespace: deployer-system
data:
  # The wildcard domain apps are served under. The wildcard certificate and the
  # wildcard A record both live in the toyintest.org Cloudflare zone and must
  # match this exactly (spec 0003, AC-8, AC-10).
  DEPLOYER_APP_DOMAIN: deploy.toyintest.org
  # The public console hostname (spec 0021, AC-1). Exactly one label under
  # DEPLOYER_APP_DOMAIN, which is what keeps it inside the wildcard certificate
  # the apps already use, and it must match the console route in
  # cloudflared-configmap.yaml. The console's own base address is derived from
  # this and is never configured separately, so there is one place the name
  # lives. DEPLOYER_PUBLIC_URL below keeps its tailnet value: it is the address
  # an agent is told about, not the address a person clicks.
  DEPLOYER_CONSOLE_HOST: console.deploy.toyintest.org

  # Both live on the Longhorn volume mounted at /data.
  DEPLOYER_DB_PATH: /data/deployer.db
  DEPLOYER_UPLOAD_DIR: /data/uploads

  DEPLOYER_INGRESS_CLASS_NAME: nginx
  DEPLOYER_APP_QUOTA_CPU: "1"
  DEPLOYER_APP_QUOTA_MEMORY: 1Gi
  DEPLOYER_APP_QUOTA_PODS: "5"
  # The two ceilings read together: the three above bound what one app consumes,
  # this one bounds how many apps one account may start. Lowering it never takes
  # an app away from an account already over it (spec 0016).
  DEPLOYER_MAX_APPS_PER_ACCOUNT: "10"
  # The two build namespaces. They are two rather than one because they enforce
  # different pod security levels: Paketo Jobs fit `restricted` and run in the
  # first, rootless BuildKit is admitted only at `privileged` and runs alone in
  # the second (spec 0009, AC-10). Setting them to the same name fails the boot,
  # because one namespace cannot enforce both. Both names have to match the
  # namespaces builds-namespace.yaml and builds-dockerfile-namespace.yaml
  # declare, and those two land through ArgoCD before the control plane that
  # routes to them.
  DEPLOYER_BUILD_NAMESPACE: deployer-builds
  DEPLOYER_BUILDKIT_NAMESPACE: deployer-builds-dockerfile
  DEPLOYER_LOG_LEVEL: info

  # Added by spec 0004. The control plane's own reachable address goes into the
  # deploy_app tool description, so an agent uploads to the right place. It must
  # match ingress.yaml's host.
  DEPLOYER_PUBLIC_URL: https://deployer.tail62ceef.ts.net

  # The same control plane, as reached from inside the cluster. The build Job's
  # init container fetches the uploaded source through this, and it resolves on
  # cluster DNS, which knows nothing of the tailnet name above. It must match
  # service.yaml's name and port.
  DEPLOYER_INTERNAL_URL: http://deployer.deployer-system.svc

  # The Paketo builder every build runs the lifecycle from, pinned by digest so a
  # builder bump is a deliberate commit. This is `builder-jammy-base:latest` as
  # it resolved on 2026-08-12; builder tags move, so re-resolve rather than
  # assume when you next touch this:
  #   crane digest paketobuildpacks/builder-jammy-base:latest
  DEPLOYER_BUILDER_IMAGE: paketobuildpacks/builder-jammy-base@sha256:edcb35967ec49840274aeb38d309ec6939eadac44fb02e5aa50519f89cac890e

  # The `cnb` user that same pinned builder declares, which the build pod has to
  # start as: the lifecycle switches to CNB_USER_ID before it does any work, and
  # under `restricted` it holds no capability to switch with. These belong to the
  # digest above and are repinned with it. Nothing reads them off the image at
  # run time (that would put a Docker Hub call on the pod's startup path), so CI
  # does it instead: the `builder uid` step reads CNB_USER_ID and CNB_GROUP_ID
  # off this exact digest and fails the build when they no longer match. To
  # re-read them by hand:
  #   crane config paketobuildpacks/builder-jammy-base@sha256:edcb... | jq '.config.Env'
  DEPLOYER_BUILD_UID: "1001"
  DEPLOYER_BUILD_GID: "1000"

  # The other engine: rootless BuildKit, which builds a project that ships its
  # own Dockerfile. Pinned by digest for the same reason the builder above is.
  # This is `v0.32.2-rootless` as it resolved on 2026-08-13:
  #   crane digest moby/buildkit:v0.32.2-rootless
  DEPLOYER_BUILDKIT_IMAGE: moby/buildkit@sha256:504731e577c20559c00f968f33219f30115e70be29ab96728d1d06e963fc494b

  # The pair that image declares in its own OCI config `User` field, which is
  # where a BuildKit image says it, since it follows no CNB_ convention. They
  # belong to the digest directly above and are repinned with it; the same
  # `builder uid` CI step checks this pair too. To re-read them by hand:
  #   crane config moby/buildkit@sha256:5047... | jq -r '.config.User'
  DEPLOYER_BUILDKIT_UID: "1000"
  DEPLOYER_BUILDKIT_GID: "1000"

  # The app container's own ceilings, inside the LimitRange maxima spec 0003 sets.
  DEPLOYER_APP_DEFAULT_CPU: 100m
  DEPLOYER_APP_DEFAULT_MEMORY: 128Mi
  DEPLOYER_APP_LIMIT_CPU: 500m
  DEPLOYER_APP_LIMIT_MEMORY: 512Mi

  # Added by spec 0007. The address every message is sent as. It is not a secret,
  # so it lives here while the API key beside it lives in the sealed
  # deployer-mail Secret. Setting one without the other fails the boot naming
  # which is missing, rather than failing at the first registration. The domain
  # needs SPF, DKIM and DMARC records in the toyintest.org zone and has to be
  # verified in Resend before anything it sends will be delivered.
  DEPLOYER_MAIL_FROM: noreply@deploy.toyintest.org

  # Added by spec 0020. Five of the six values that switch daily backups on; the
  # sixth and seventh, the R2 access key pair, are credentials and live in the
  # sealed deployer-backup Secret. All six are one all or nothing group in
  # internal/config: set them all and backups run, set none and the platform
  # boots, warns, and works in every other respect, set some and it refuses to
  # start naming what is missing (AC-15, AC-16).
  #
  # The recipient is an age PUBLIC key and belongs here in clear. Its private
  # half is held off cluster, in a password manager and on paper, and exists in
  # no Secret, no variable, and no file in this repository. That is the whole
  # design: the platform encrypts backups it cannot itself read, so a compromise
  # of this pod yields ciphertext, and a cluster that is gone entirely is still
  # recoverable. Lose that private half and every backup is permanently
  # unreadable with nothing to warn you until a restore is attempted.
  DEPLOYER_BACKUP_AGE_RECIPIENT: age1j3svt4hfzlqq75eqmsyc0a7rvlvxjd0ddh3ckn82p0u0852w7azqj2uuuw

  # The account level R2 host, not the bucket scoped URL the dashboard shows:
  # the bucket travels as its own value below. The account id is an identifier
  # rather than a credential, which is why it sits here.
  DEPLOYER_BACKUP_S3_ENDPOINT: https://46cc20661b5d8547874081f7a5e40b39.r2.cloudflarestorage.com
  DEPLOYER_BACKUP_S3_BUCKET: deployer-backups
  # R2 has no regions. `auto` is the literal string its S3 API expects.
  DEPLOYER_BACKUP_S3_REGION: auto

  # Where a failed backup complains to, and where the first success after a
  # failure reports recovery. Silence means healthy, so this address is inside
  # the all or nothing group above rather than optional: backups configured with
  # nowhere to complain to is the precise failure the feature exists to prevent.
  DEPLOYER_BACKUP_ALERT_EMAIL: ogunseindetoyin@gmail.com

  # DEPLOYER_SELF_IMAGE is deliberately not here: it lives in deployment.yaml
  # beside the image it must match, so CI can rewrite both from one value.
  # The timeouts, the reconcile interval, and the extraction caps all take their
  # defaults from internal/config; set one here only to move it off the default.
