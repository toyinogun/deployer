# Where build Jobs run (spec 0004, AC-7). This namespace executes code the
# platform did not author, over a tarball the platform did not author, so it
# holds no cluster credentials beyond the one registry credential a build needs
# to push.
#
# It enforces `baseline` rather than `restricted`, which is the one place in this
# repo that is true (spec 0009, AC-10). Rootless BuildKit cannot fit inside
# `restricted`: it was run against the pinned image on this cluster and needs an
# unconfined seccomp profile, an unconfined AppArmor profile,
# allowPrivilegeEscalation true, and SETUID plus SETGID added back on top of
# dropping all capabilities. Those four are exactly what `baseline` permits, so
# none of them needs a further exception, and the fifth one does not exist: if it
# is ever needed, the agreed answer is to split this namespace in two rather than
# widen it again (spec 0009, Follow-up).
#
# The Buildpacks pod is unchanged and still composes every field `restricted`
# asks for, including allowPrivilegeEscalation false and all capabilities
# dropped. What used to be enforced here is now pinned by a test over the
# composer instead, which is a weaker guarantee and was priced as such.
#
# The audit and warn levels stay at `restricted` on purpose: the API server then
# still says which pods deviate, so the four expected deviations are visible and
# a fifth is noisy rather than silent.
apiVersion: v1
kind: Namespace
metadata:
  name: deployer-builds
  labels:
    app.kubernetes.io/name: deployer
    app.kubernetes.io/managed-by: argocd
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# The control plane's reach into the build namespace. Declared here rather than
# created at runtime, because this namespace is part of the platform and ArgoCD
# owns it: the control plane only creates bindings in the app-<slug> namespaces
# it makes itself.
#
# ClusterRole/deployer-app is wider than a build needs (it also covers
# Deployments, Ingresses and the rest), but splitting it would mean two roles to
# keep in step for no reduction in what a build Job can actually do: the Job is
# the thing running untrusted code, and it holds no service account rights at
# all. This binding is for the control plane, not for the builder.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-builds
  namespace: deployer-builds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployer-app
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: deployer-system
