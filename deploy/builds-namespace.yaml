# Where build Jobs run (spec 0004, AC-7). This namespace executes code the
# platform did not author, over a tarball the platform did not author, so it
# holds no cluster credentials beyond the one registry credential a build needs
# to push.
#
# It enforces `restricted`, and it holds Paketo build Jobs only. The Buildpacks
# pod composes every field that level asks for, including allowPrivilegeEscalation
# false and all capabilities dropped, so nothing here needs an exception (spec
# 0009, AC-10).
#
# Rootless BuildKit does not run here and cannot: it needs four deviations, two
# of which are forbidden outright below `privileged`. It has a namespace of its
# own, builds-dockerfile-namespace.yaml, holding that one pod shape and nothing
# else. This file briefly enforced `baseline` to try to hold both; that was
# refused at admission on every attempt and is the correction spec 0009's
# rationale records.
#
# Enforcing `restricted` here is also what makes a routing bug loud. A BuildKit
# Job that lands in this namespace by mistake is refused when it is created,
# which the platform reports, rather than running quietly in the wrong place
# (AC-20).
apiVersion: v1
kind: Namespace
metadata:
  name: deployer-builds
  labels:
    app.kubernetes.io/name: deployer
    app.kubernetes.io/managed-by: argocd
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# The control plane's reach into the build namespace. Declared here rather than
# created at runtime, because this namespace is part of the platform and ArgoCD
# owns it: the control plane only creates bindings in the app-<slug> namespaces
# it makes itself.
#
# ClusterRole/deployer-app is wider than a build needs (it also covers
# Deployments, Ingresses and the rest), but splitting it would mean two roles to
# keep in step for no reduction in what a build Job can actually do: the Job is
# the thing running untrusted code, and it holds no service account rights at
# all. This binding is for the control plane, not for the builder.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-builds
  namespace: deployer-builds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployer-app
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: deployer-system
