# Copy into k3sprox-gitops. cert-manager's cluster resource namespace on this
# cluster is `cert-manager` (its own namespace: the flag reads
# --cluster-resource-namespace=$(POD_NAMESPACE)), so that is where the sealed
# Cloudflare token must land for these solvers to resolve it.
#
# Start on staging, confirm the wildcard Certificate goes Ready, then switch the
# Certificate to prod. Let's Encrypt production rate limits are unforgiving.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ogunseindetoyin@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ogunseindetoyin@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
