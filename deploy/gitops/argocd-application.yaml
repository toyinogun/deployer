# Copy into k3sprox-gitops/apps/. Two objects, and the AppProject is the half
# that makes AC-15 true: it is what stops a sync from ever seeing, let alone
# pruning, a runtime created app-<slug> namespace.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: deployer
  namespace: argocd
spec:
  description: The Deployer control plane, and nothing else in the cluster.
  sourceRepos:
    - https://github.com/toyinogun/deployer.git
  # The only namespaces this project may write to, every one of them a platform
  # namespace this repository owns. An app-<slug> namespace created by the
  # control plane at runtime is still out of scope by construction, which is
  # what stops a sync with prune from ever reaching a deployed app (AC-15).
  #
  # The two build namespaces are here because their RoleBindings and their
  # NetworkPolicies ship in deploy/. Each namespace object is cluster scoped and
  # would have been permitted anyway; the objects inside it are what need the
  # destination. A build namespace that is not listed here fails the whole sync
  # at validation, so nothing in this repository applies at all, not just the
  # part that named it. That is exactly what happened when
  # deployer-builds-dockerfile first shipped (spec 0009, build step 12a).
  destinations:
    - server: https://kubernetes.default.svc
      namespace: deployer-system
    - server: https://kubernetes.default.svc
      namespace: deployer-builds
    - server: https://kubernetes.default.svc
      namespace: deployer-builds-dockerfile
  # The cluster scoped kinds the control plane's own manifests contain. Namespace
  # is listed by name so the project cannot manage any other namespace object.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    # The fence that keeps the two cluster wide rights in rbac.yaml from reaching
    # kube-system. It ships with the control plane, so the project must be able
    # to manage it.
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deployer
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: deployer
  source:
    repoURL: https://github.com/toyinogun/deployer.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: deployer-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
