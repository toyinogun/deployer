apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployer
  namespace: deployer-system
  labels:
    app: deployer
spec:
  replicas: 1
  # Two writers on one SQLite file is corruption, so the old pod must be gone
  # before the new one starts (spec 0001 invariant, spec 0003 AC-2).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deployer
  template:
    metadata:
      labels:
        app: deployer
    spec:
      serviceAccountName: deployer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Load bearing, not decoration: Longhorn presents the volume root owned,
        # so without this the non root process cannot create the SQLite file and
        # the pod never becomes ready.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: deployer
          # Rewritten by the `publish` job in .github/workflows/ci.yml on every
          # push to main, to ghcr.io/toyinogun/deployer@sha256:... ArgoCD applies
          # this file as written, so it must always hold a digest a kubelet can
          # pull. Never a `ko://` reference (nothing resolves it in the ArgoCD
          # path) and never a mutable tag (spec 0001 invariant).
          image: ghcr.io/toyinogun/deployer@sha256:5a69bbbfb4595baf3d8eb9260b8a3122844dab1d1331d8d922b5b9fe81becb0a
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: deployer-config
            # Registry push credentials. Slice 1 owns this Secret; see deploy/README.md
            # for the placeholder that lets the control plane boot before then.
            - secretRef:
                name: deployer-registry
            # The single API token this slice authenticates with. Optional on
            # purpose: without it the platform still boots, warns that it has no
            # usable token, and refuses every call, which is a better failure
            # than a pod that will not start (spec 0004, AC-1).
            - secretRef:
                name: deployer-bootstrap
                optional: true
            # The Resend API key registration and password reset send through.
            # Optional for the same reason: without it the platform boots, every
            # deploy still works, and only the three endpoints that exist to send
            # mail answer mail_unavailable (spec 0007, AC-26). Seal it yourself:
            #   kubectl create secret generic deployer-mail \
            #     --from-literal=DEPLOYER_RESEND_API_KEY=re_... \
            #     --dry-run=client -o yaml | kubeseal -o yaml > deploy/mail-sealedsecret.yaml
            - secretRef:
                name: deployer-mail
                optional: true
            # The key every page form's CSRF token is derived under. Not optional:
            # the pages are session authenticated and a platform that boots
            # without it would be serving forms it cannot verify, so refusing to
            # start is the right failure (spec 0013, AC-12). Seal it yourself:
            #   kubectl create secret generic deployer-web \
            #     --from-literal=DEPLOYER_CSRF_KEY="$(openssl rand -hex 32)" \
            #     --dry-run=client -o yaml | kubeseal -o yaml > deploy/web-sealedsecret.yaml
            - secretRef:
                name: deployer-web
            # The R2 access key pair the daily backup uploads with. Marked
            # optional so the reference resolves on a cluster that has not been
            # given it yet, but the six backup values are all or nothing: with
            # the other five in configmap.yaml and this pair absent the process
            # refuses to start naming what is missing, which is AC-16 rather
            # than an accident. Taking backups off means removing all six, not
            # this one (spec 0020, AC-15, AC-16). The other five are not secrets
            # and live in configmap.yaml, the age recipient included, because a
            # recipient is a public key. Seal these two yourself:
            #   kubectl -n deployer-system create secret generic deployer-backup \
            #     --from-literal=DEPLOYER_BACKUP_S3_ACCESS_KEY_ID=... \
            #     --from-literal=DEPLOYER_BACKUP_S3_SECRET_ACCESS_KEY=... \
            #     --dry-run=client -o yaml | kubeseal --format yaml > deploy/backup-sealedsecret.yaml
            - secretRef:
                name: deployer-backup
                optional: true
          env:
            - name: DEPLOYER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DEPLOYER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The control plane's own image, reused as the build Job's init
            # container so it can fetch and safely unpack the source tarball. The
            # downward API cannot report a container's image, so it is set here,
            # and the same `publish` job that rewrites `image:` above rewrites
            # this line from the same value. Keep them identical: a stale one
            # means builds run an old extractor against a new control plane.
            - name: DEPLOYER_SELF_IMAGE
              value: ghcr.io/toyinogun/deployer@sha256:5a69bbbfb4595baf3d8eb9260b8a3122844dab1d1331d8d922b5b9fe81becb0a
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Liveness asks only whether the process is alive. Readiness is what
          # gates traffic, so a locked or unwritable database takes the pod out of
          # its Service without restarting it in a loop (AC-4).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            # The root filesystem is read only, so anything needing scratch space
            # needs somewhere to put it.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deployer-data
        - name: tmp
          emptyDir: {}
