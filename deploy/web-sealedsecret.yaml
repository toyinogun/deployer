# The key every page form's CSRF token is derived under (spec 0013, AC-12).
#
# This file is a placeholder, not a sealed value: sealing needs the cluster's own
# public key, so it has to be produced against the cluster it will run on. Until
# it is replaced the control plane will not start, which is deliberate: a page
# surface that cannot verify its own forms should not serve them.
#
#   kubectl create secret generic deployer-web \
#     --from-literal=DEPLOYER_CSRF_KEY="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubeseal -o yaml > deploy/web-sealedsecret.yaml
#
# Rotating the key invalidates every form that is open at that moment, which is
# harmless: a resubmit succeeds.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: deployer-web
  namespace: deployer-system
spec:
  encryptedData:
    DEPLOYER_CSRF_KEY: REPLACE_ME_WITH_A_SEALED_VALUE
  template:
    metadata:
      name: deployer-web
      namespace: deployer-system
