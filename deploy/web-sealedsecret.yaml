# The key every page form's CSRF token is derived under (spec 0013, AC-12).
#
# Sealed against this cluster, for the deployer-system namespace. SealedSecrets
# are namespace scoped: a value sealed for another namespace will not unseal
# here, so the namespace on the kubectl create line is load bearing rather than
# cosmetic.
#
#   kubectl create secret generic deployer-web -n deployer-system \
#     --from-literal=DEPLOYER_CSRF_KEY="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubeseal -o yaml > deploy/web-sealedsecret.yaml
#
# Rotating the key invalidates every form that is open at that moment, which is
# harmless: a resubmit succeeds.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: deployer-web
  namespace: deployer-system
spec:
  encryptedData:
    DEPLOYER_CSRF_KEY: 
  template:
    metadata:
      name: deployer-web
      namespace: deployer-system
