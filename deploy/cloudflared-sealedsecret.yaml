# The tunnel credential (spec 0021, AC-10).
#
# Sealed against this cluster's own public key, so the value below decrypts
# nowhere else and is safe in the repository. It came out of
# `cloudflared tunnel create deployer`, which writes a JSON file holding the
# tunnel's account tag, id and secret. Reseal it the same way:
#
#   kubectl create secret generic cloudflared-credentials \
#     --namespace deployer-edge \
#     --from-file=credentials.json=$HOME/.cloudflared/<tunnel-id>.json \
#     --dry-run=client -o yaml \
#     | kubeseal -o yaml > deploy/cloudflared-sealedsecret.yaml
#
# kubeseal writes no comments, so restore this header by hand after resealing.
#
# Not optional, unlike the mail and bootstrap secrets: a tunnel with no
# credential registers no connector, and a public edge that cannot come up should
# not pretend it has.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflared-credentials
  namespace: deployer-edge
spec:
  encryptedData:
    credentials.json: 
  template:
    metadata:
      name: cloudflared-credentials
      namespace: deployer-edge
