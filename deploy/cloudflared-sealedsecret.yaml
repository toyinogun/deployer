# The tunnel credential (spec 0021, AC-10).
#
# A placeholder until it is produced against the cluster it will run on, exactly
# like web-sealedsecret.yaml and backup-sealedsecret.yaml. Sealing needs the
# cluster's own public key, so the value below is not a real one and the file is
# useless anywhere else even once it is.
#
# The credential comes out of `cloudflared tunnel create deployer`, which writes
# a JSON file holding the tunnel's account tag, id and secret. Seal it with:
#
#   kubectl create secret generic cloudflared-credentials \
#     --namespace cloudflared \
#     --from-file=credentials.json=$HOME/.cloudflared/<tunnel-id>.json \
#     --dry-run=client -o yaml \
#     | kubeseal -o yaml > deploy/cloudflared-sealedsecret.yaml
#
# Not optional, unlike the mail and bootstrap secrets: a tunnel with no
# credential registers no connector, and a public edge that cannot come up should
# not pretend it has.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflared-credentials
  namespace: cloudflared
spec:
  encryptedData:
    credentials.json: REPLACE_ME_WITH_A_SEALED_VALUE
  template:
    metadata:
      name: cloudflared-credentials
      namespace: cloudflared
