# The platform sits on its own tailnet name, never on the app wildcard (AC-13).
# Here the `tailscale` ingress class is exactly right: it gives the control plane
# a ts.net name with a Tailscale issued certificate. Apps must never use this
# class, because it would terminate TLS at Tailscale and break the wildcard
# certificate design.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deployer
  namespace: deployer-system
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: deployer
      port:
        name: http
  tls:
    # Tailscale fills the host in from the tailnet name it assigns.
    - hosts: [deployer]
