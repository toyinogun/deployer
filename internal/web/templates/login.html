{{define "title"}}Sign in{{end}}
{{define "content"}}
<div class="card auth-card">
  <p class="brand">Deployer</p>
  <h1>Sign in</h1>
  {{if .Data.Message}}<p class="alert" role="alert">{{.Data.Message}}</p>{{end}}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{.Data.CSRF}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" required value="{{.Data.Email}}">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="button" type="submit">Sign in</button>
  </form>
  <p class="quiet">
    <a href="/register">Create an account</a> · <a href="/forgot">Forgot your password</a>
  </p>
</div>
{{end}}
